[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # webpki-roots (Mozilla CA bundle data, via rustls)
    "CDLA-Permissive-2.0",
]

[advisories]
yanked = "deny"
ignore = [
    # Marvin Attack timing sidechannel in the `rsa` crate (no fixed
    # version upstream). rsa is a dev-dependency only — tests use it to
    # mint RSA keys for mock-OIDC JWT signing. It is not compiled into
    # any shipped binary; runtime JWT verification uses jsonwebtoken's
    # verify path, not `rsa`.
    { id = "RUSTSEC-2023-0071", reason = "dev-dependency only (test JWT signing), not in shipped binaries" },
]

[bans]
multiple-versions = "warn"
