[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # webpki-roots (Mozilla CA bundle data, via rustls)
    "CDLA-Permissive-2.0",
]

[advisories]
yanked = "deny"
ignore = [
    # Marvin Attack: a timing sidechannel in the `rsa` crate's PKCS#1 v1.5
    # *private-key decryption* (no fixed version upstream). As of
    # jsonwebtoken 11 with the pure-Rust `rust_crypto` provider, `rsa` is a
    # RUNTIME dependency (chosen over `aws_lc_rs` because the latter needs a C
    # toolchain, which breaks the UBI9/STIG-minimal images). Mobula only uses
    # it for RS256 signature *verification* with OIDC public keys — it never
    # performs RSA decryption or signing with a private key, so the vulnerable
    # code path is not exercised. Revisit if a fixed `rsa` ships or if we ever
    # switch the provider to `aws_lc_rs`.
    { id = "RUSTSEC-2023-0071", reason = "runtime via jsonwebtoken/rust_crypto, but only RS256 public-key verification — the Marvin private-key decryption path is never used" },
]

[bans]
multiple-versions = "warn"
