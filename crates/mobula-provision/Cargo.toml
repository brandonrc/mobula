[package]
name = "mobula-provision"
description = "Provisioner abstraction for Mobula backends (KubeRay first; VMs later)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["kuberay"]
# The live Kubernetes client. Pure translation (kuberay::manifest) is always
# available; this feature adds the kube-rs-backed Provisioner.
kuberay = ["dep:kube", "dep:k8s-openapi", "dep:tokio", "dep:tracing"]

[dependencies]
mobula-core.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
kube = { version = "0.99", default-features = false, features = ["client", "rustls-tls"], optional = true }
k8s-openapi = { version = "0.24", features = ["latest"], optional = true }
