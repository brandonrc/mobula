[package]
name = "mobula-provision"
description = "Provisioner abstraction for Mobula backends (KubeRay first; VMs later)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["kuberay"]
# The live Kubernetes client. Pure translation (kuberay::manifest) is always
# available; this feature adds the kube-rs-backed Provisioner.
kuberay = ["dep:kube", "dep:k8s-openapi", "dep:tokio", "dep:tracing", "dep:rustls"]
# FIPS 140-3 mode (#61): install the aws-lc-rs FIPS provider (instead of
# ring) as rustls' process default from the kube connect paths, matching the
# startup check in mobula_core::crypto.
fips = ["mobula-core/fips", "rustls?/fips"]

[dependencies]
mobula-core.workspace = true
mobula-policy.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls"], optional = true }
k8s-openapi = { version = "0.24", features = ["latest"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }

[dev-dependencies]
# Mock kube::Client for the router/dask-client unit tests: a tower service
# that answers canned k8s JSON, so dispatch + the pod-based observe are tested
# without a live cluster (the e2e workflow covers the real thing).
http = "1"
tower = { workspace = true }
tokio = { workspace = true }
