[package]
name = "mobula-auth"
description = "OIDC/JWT identity and role mapping for the Mobula control plane"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Forwards mobula-controller's defaults (#61: the Postgres TLS provider is
# feature-selected there, so this edge is default-features = false to let
# FIPS builds swap it; see ADR-0012).
default = ["mobula-controller/postgres", "mobula-controller/tls-ring"]

[dependencies]
mobula-core.workspace = true
mobula-controller = { workspace = true, default-features = false }
async-trait.workspace = true
bcrypt.workspace = true
jsonwebtoken.workspace = true
rand = "0.8"
reqwest = { workspace = true, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
axum.workspace = true
rsa = { version = "0.9", features = ["pem"] }
