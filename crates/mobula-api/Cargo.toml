[package]
name = "mobula-api"
description = "HTTP API surface of the Mobula control plane"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
mobula-core.workspace = true
# default-features = false + forwarding in [features] so FIPS builds can
# swap mobula-controller's Postgres TLS provider (#61, ADR-0012).
mobula-controller = { workspace = true, default-features = false }
mobula-provision.workspace = true
mobula-policy.workspace = true
mobula-auth = { workspace = true, default-features = false }
axum.workspace = true
futures.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
tower = { workspace = true }
tower-http = { workspace = true }
utoipa.workspace = true
utoipa-swagger-ui.workspace = true
async-trait.workspace = true

[features]
# Re-exports the dev/test-only router constructors (build_router/build_app/
# build_app_full/build_app_full_svc) that default validator=None. These
# bypass the fail-closed guard, so they must never be reachable in a
# production build (#45); they exist only for tests and embedded fixtures.
test-util = []
# Forwards the dependency defaults turned off above (#61).
default = ["mobula-controller/postgres", "mobula-controller/tls-ring"]

[dev-dependencies]
async-trait.workspace = true
jsonwebtoken.workspace = true
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
# Enable `test-util` for this crate's own integration tests (which are a
# separate crate and would not otherwise see the feature) without forcing
# it on downstream consumers.
mobula-api = { path = ".", features = ["test-util"] }
