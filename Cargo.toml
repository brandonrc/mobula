[workspace]
resolver = "2"
members = [
    "crates/mobula-core",
    "crates/mobula-provision",
    "crates/mobula-controller",
    "crates/mobula-policy",
    "crates/mobula-auth",
    "crates/mobula-api",
    "crates/mobula-proxy",
    "crates/mobula-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/brandonrc/mobula"
rust-version = "1.85"

[workspace.dependencies]
mobula-core = { path = "crates/mobula-core" }
mobula-provision = { path = "crates/mobula-provision" }
mobula-controller = { path = "crates/mobula-controller" }
mobula-policy = { path = "crates/mobula-policy" }
mobula-api = { path = "crates/mobula-api" }
mobula-auth = { path = "crates/mobula-auth" }
mobula-proxy = { path = "crates/mobula-proxy" }

async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
futures = "0.3"
# v11 made the crypto backend pluggable; pick the pure-Rust provider (no C
# toolchain — matches the UBI9/STIG-minimal images and the rustls stack).
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio-tungstenite = "0.29"
toml = "1"
# bcrypt for local-auth password/token hashing (ADR-0011). Pure Rust, MIT OR
# Apache-2.0 — no C toolchain, matching the rustls/UBI9 posture.
bcrypt = "0.19"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = { version = "0.5", features = ["util", "limit"] }
tower-http = { version = "0.6", features = ["timeout", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }
