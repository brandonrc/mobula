# Auth variant of the local demo stack: adds a local Keycloak (realm
# `mobula`, four role-mapped test users) and runs the control plane with
# real OIDC enforcement instead of --dev-allow-unauthenticated.
#
#   ./deploy/up.sh auth           # stops the plain demo, builds, starts this
#   ./deploy/up.sh auth down      # tear down (add -v to also wipe Keycloak's
#                                 # H2 data so the realm re-imports next time)
#
# The one deliberate trick in here: the OIDC issuer string must be identical
# from three vantage points — your shell (CLI/curl), the mobula container
# (discovery + JWKS fetch), and the `iss` claim Keycloak mints. Keycloak's
# hostname is pinned to http://localhost:8090, and the mobula container
# SHARES Keycloak's network namespace (network_mode: service:keycloak) so
# "localhost:8090" resolves to Keycloak from inside mobula too. Consequence:
# mobula's :8484 lives in that namespace, so both host ports are published
# on the keycloak service, and "mobula" becomes a network alias for it (the
# UI's nginx proxies to mobula:8484 unchanged).

services:
  keycloak:
    profiles: ["auth"]
    image: quay.io/keycloak/keycloak:26.7.1
    command:
      - "start-dev"
      - "--import-realm"
      - "--hostname=http://localhost:8090"
      - "--http-port=8090"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/mobula-realm.json:/opt/keycloak/data/import/mobula-realm.json:ro
    # Both ports belong to the shared namespace this container owns:
    # 8090 = Keycloak, 8484 = the auth-enabled mobula API.
    ports:
      - "8090:8090"
      - "8484:8484"
    networks:
      default:
        aliases:
          - mobula
    healthcheck:
      # The keycloak image ships no curl/wget; probe with bash's /dev/tcp.
      # Hit the realm's discovery document (not /health — that lives on the
      # management interface :9000) so "healthy" also means "realm imported".
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8090 && printf 'GET /realms/mobula/.well-known/openid-configuration HTTP/1.0\r\n\r\n' >&3 && grep -q '200' <&3"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  mobula:
    profiles: ["auth"]
    # Same image as the base demo, but authenticated: real OIDC validation
    # against the local Keycloak. --allow-insecure-transport because the
    # issuer is cleartext http (local demo only — never in production).
    # Local auth is ALSO enabled so this stack demonstrates both providers
    # at once (SSO button + local form on /login; JWT-shaped bearers go to
    # Keycloak validation, opaque mob_ tokens to the local store).
    network_mode: "service:keycloak"
    ports: !reset []
    depends_on:
      keycloak:
        condition: service_healthy
      auth-init:
        condition: service_completed_successfully
    command:
      - "serve"
      - "--bind"
      - "0.0.0.0:8484"
      - "--demo"
      - "--auth-config"
      - "/etc/mobula/auth.toml"
      - "--local-auth"
      - "--db"
      - "/data/mobula.db"
      - "--allow-insecure-transport"
      - "--audit-log"
      - "/data/mobula-audit.jsonl"
      - "--metering-interval-secs"
      - "5"
      - "--policy"
      - "/etc/mobula/policy.toml"
    environment:
      MOBULA_LOCAL_ADMIN_PASSWORD: "admin"
    volumes:
      - ./keycloak/auth.toml:/etc/mobula/auth.toml:ro
      - ./policy.toml:/etc/mobula/policy.toml:ro
      - mobula-auth-data:/data

  # Same root-owned-volume fix as the local variant (mobula runs as 1001).
  auth-init:
    profiles: ["auth"]
    image: alpine:3
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /data && chown -R 1001:0 /data"]
    volumes:
      - mobula-auth-data:/data

volumes:
  mobula-auth-data:
