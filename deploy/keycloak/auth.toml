# Mobula auth config for the local Keycloak demo (deploy/docker-compose.auth.yml).
# The issuer string must be identical everywhere: host (CLI/curl), the mobula
# container (discovery + JWKS), and Keycloak's pinned hostname (the iss claim).
# That is why Keycloak is pinned to http://localhost:8090 and the mobula
# container shares Keycloak's network namespace in the overlay.
issuer = "http://localhost:8090/realms/mobula"
audience = "mobula"
groups_claim = "groups"

[roles]
admin = ["/platform-admins"]
operator = ["/sre"]
developer = ["/ml-eng"]
viewer = ["/observers"]
auditor = ["/compliance"]

# #103: group->project-role automation (self-service). A caller in a matching
# group automatically holds the mapped role scoped to project:<group> (after
# strip_prefix), with NO manual `PUT /api/v1/access/assignments`. "*" => every
# group the caller is in derives its own project role — the plain
# `team-a member => operator on project:team-a` rule. Additive on top of
# [roles]; omit the table to keep it off (deny-by-default). operator/developer
# are the meaningful entries.
#
# [project_roles]
# operator = ["*"]
# strip_prefix = "/"   # Keycloak "/team-a" groups => project:team-a
