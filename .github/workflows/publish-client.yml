name: Publish TS client

# Generates @brandonrc/mobula-client from the committed openapi.json (the
# source of truth) and publishes it to the GitHub Packages npm registry.
# Runs on version tags (v*), and on demand. openapi.json itself is drift-
# guarded by the CI workflow, so a tag always ships a client matching the
# code at that commit.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "npm version to publish (e.g. 0.0.2)"
        required: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@brandonrc"

      - name: Align package version to the tag / input
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
          fi
          if [ -n "$VER" ]; then
            npm version "$VER" --no-git-tag-version --allow-same-version
          fi

      - name: Install, generate from openapi.json, build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Publish to GitHub Packages
        run: |
          # Copy the source-of-truth spec into the package so consumers can
          # import '@brandonrc/mobula-client/openapi.json' too.
          cp ../../openapi.json ./openapi.json
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
