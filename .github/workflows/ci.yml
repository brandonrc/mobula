name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # PostgresStore conformance (#48): tests/store.rs runs its scenarios
      # against Postgres when MOBULA_TEST_POSTGRES_URL is set.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mobula
          POSTGRES_PASSWORD: mobula
          POSTGRES_DB: mobula
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mobula -d mobula"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        env:
          MOBULA_TEST_POSTGRES_URL: postgres://mobula:mobula@localhost:5432/mobula
        run: cargo test --workspace

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage gate (90% lines, CLI shim and live kube clients excluded)
        run: >
          cargo llvm-cov --workspace
          --ignore-filename-regex 'mobula-cli/src/main\.rs|mobula-provision/src/kuberay_client\.rs|mobula-provision/src/kueue_client\.rs'
          --fail-under-lines 90

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
        env:
          # fmt/clippy run as dedicated jobs above; here we want the
          # hygiene + secret-scanning hooks.
          SKIP: cargo-fmt,cargo-clippy
