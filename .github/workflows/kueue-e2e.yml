name: Kueue E2E

# Provisions real Kueue pool objects (Cohort/ResourceFlavor/ClusterQueue/
# LocalQueue) through Mobula's KueueClient on a kind cluster with Kueue
# v0.19.1 + the KubeRay operator installed, then proves quota admission:
# the first RayCluster is admitted, the second (over nominal quota) queues.
# Heavy (image pulls), so gated: on demand and weekly, plus when the
# provisioner changes.
on:
  push:
    branches: [main]
    paths:
      - "crates/mobula-provision/**"
      - ".github/workflows/kueue-e2e.yml"
  schedule:
    - cron: "52 6 * * 1" # Mondays 06:52 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: mobula-kueue-e2e
          # Kueue v0.19.x supports Kubernetes >= 1.34.
          node_image: kindest/node:v1.34.0

      - name: Install Kueue
        run: |
          kubectl apply --server-side -f https://github.com/kubernetes-sigs/kueue/releases/download/v0.19.1/manifests.yaml
          kubectl wait --for=condition=Available deployment/kueue-controller-manager \
            -n kueue-system --timeout=300s

      - name: Install the KubeRay operator
        run: |
          helm repo add kuberay https://ray-project.github.io/kuberay-helm/
          helm repo update
          helm install kuberay-operator kuberay/kuberay-operator \
            --version 1.4.0 --wait --timeout 5m
          kubectl wait --for=condition=Available deploy/kuberay-operator --timeout=180s

      - name: Pool apply → quota admission → teardown through Mobula
        env:
          MOBULA_E2E_NAMESPACE: default
        run: cargo test -p mobula-provision --test kueue_e2e -- --ignored --nocapture

      - name: Diagnostics
        if: always()
        run: |
          echo "=== kueue objects ==="
          kubectl get workloads,clusterqueues,localqueues,cohorts,resourceflavors -o yaml || true
          echo "=== rayclusters ==="
          kubectl get rayclusters -o wide || true
          kubectl describe rayclusters || true
          echo "=== pods ==="
          kubectl get pods -o wide || true
          echo "=== kueue controller logs ==="
          kubectl logs -n kueue-system deployment/kueue-controller-manager --tail=200 || true
          echo "=== head pod logs (current) ==="
          kubectl logs -l ray.io/node-type=head --tail=100 || true
